ruleset-locked = ''
table inet filter {

  chain input {
    type filter hook input priority 0;
    policy drop;

    iif lo accept
    ct state established,related accept

    iifname "wg0" accept
  }

  chain output {
    type filter hook output priority 0;
    policy drop;

    oif lo accept
    ct state established,related accept

    oifname "wg0" ip daddr 192.168.99.78 accept
  }
}
'';